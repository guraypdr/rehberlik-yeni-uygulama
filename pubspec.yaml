name: rehberlik_app
description: "Rehberlik ve psikolojik danışmanlık iş takip uygulaması."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Veritabanı — Windows için FFI köprüsü gerekir
  sqflite_common_ffi: ^2.3.4+4
  sqflite: ^2.4.2

  # Dosya yolu yönetimi
  path_provider: ^2.1.5
  path: ^1.9.1

  # Dosya seçici (aç / kaydet)
  file_picker: ^8.3.7

  # Kalıcı basit ayarlar (tema rengi, son dosyalar listesi)
  shared_preferences: ^2.5.6

  # Routing
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
